name: Build macOS app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: chmod +x build-macos.sh && ./build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RightHandQuestMacOverlay-macOS
          path: dist/RightHandQuestMacOverlay-macOS.zip
      - name: Attach app to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RightHandQuestMacOverlay-macOS.zip
